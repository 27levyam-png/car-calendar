name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        run: npx --yes @capacitor/assets generate --android

      - name: Widget and notifications
        run: python3 native/patch.py

      - name: Set version (number from index.html, build code auto-increases)
        run: |
          VER=$(grep -oP "APP_VERSION = '\K[^']+" index.html || echo "1.0")
          echo "VER=$VER" >> $GITHUB_ENV
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle

      - name: Use the fixed signing key (allows updating without uninstall)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../car-calendar-${{ env.VER }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          name: יומן הרכב ${{ env.VER }}
          files: car-calendar-${{ env.VER }}.apk
